generated: '2026-06-20'
method: searched
source: https://www.twilio.com/docs/sendgrid/for-developers/sending-email/libraries
description: >-
  First-party Twilio SendGrid helper libraries. Each is published from the
  github.com/sendgrid organization and to its language's public package
  registry. Verified against the SendGrid libraries documentation and the
  SDK/SourceCode links already recorded in apis.yml. SendGrid does not ship a
  first-party command-line tool, so there is no CLI entry here; the official
  Model Context Protocol coverage is the Twilio-labs MCP server (see mcp/).
packages:
  - language: python
    registry: pypi
    name: sendgrid
    url: https://pypi.org/project/sendgrid/
    source: https://github.com/sendgrid/sendgrid-python
    install: pip install sendgrid
    official: true
  - language: javascript
    registry: npm
    name: "@sendgrid/mail"
    url: https://www.npmjs.com/package/@sendgrid/mail
    source: https://github.com/sendgrid/sendgrid-nodejs
    install: npm install @sendgrid/mail
    official: true
    note: >-
      The sendgrid-nodejs monorepo also publishes @sendgrid/client (v3 API
      client), @sendgrid/eventwebhook, @sendgrid/helpers, and @sendgrid/inbound-mail-parser.
  - language: javascript
    registry: npm
    name: "@sendgrid/client"
    url: https://www.npmjs.com/package/@sendgrid/client
    source: https://github.com/sendgrid/sendgrid-nodejs
    install: npm install @sendgrid/client
    official: true
  - language: java
    registry: maven
    name: com.sendgrid:sendgrid-java
    url: https://central.sonatype.com/artifact/com.sendgrid/sendgrid-java
    source: https://github.com/sendgrid/sendgrid-java
    install: "implementation 'com.sendgrid:sendgrid-java'"
    official: true
  - language: csharp
    registry: nuget
    name: SendGrid
    url: https://www.nuget.org/packages/SendGrid
    source: https://github.com/sendgrid/sendgrid-csharp
    install: dotnet add package SendGrid
    official: true
  - language: go
    registry: pkg.go.dev
    name: github.com/sendgrid/sendgrid-go
    url: https://pkg.go.dev/github.com/sendgrid/sendgrid-go
    source: https://github.com/sendgrid/sendgrid-go
    install: go get github.com/sendgrid/sendgrid-go
    official: true
  - language: ruby
    registry: rubygems
    name: sendgrid-ruby
    url: https://rubygems.org/gems/sendgrid-ruby
    source: https://github.com/sendgrid/sendgrid-ruby
    install: gem install sendgrid-ruby
    official: true
  - language: php
    registry: packagist
    name: sendgrid/sendgrid
    url: https://packagist.org/packages/sendgrid/sendgrid
    source: https://github.com/sendgrid/sendgrid-php
    install: composer require sendgrid/sendgrid
    official: true
