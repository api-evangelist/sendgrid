description: >-
  First-party Twilio SendGrid helper libraries. Each is published from the
  github.com/sendgrid organization and to its language's public package
  registry. Verified against the SendGrid libraries documentation and the
  SDK/SourceCode links recorded in apis.yml. SendGrid does not ship a
  first-party command-line tool, so there is no CLI entry here; the official
  Model Context Protocol coverage is Twilio's hosted docs MCP server plus the
  @twilio-alpha/mcp stdio package (see mcp/sendgrid-mcp.yml).
  CURRENCY (read from each registry's metadata endpoint on 2026-08-13, all
  unauthenticated): the SDK fleet is drifting. Node.js and Python were last
  published 2025-09-19; every other language is older, and Ruby has not been
  republished since 2023-12-01 — more than two and a half years, against a v3
  API that shipped Engagement Quality, Segments 2.0 and data-residency changes
  in that window. The npm sidecar packages (@sendgrid/eventwebhook,
  @sendgrid/helpers, @sendgrid/inbound-mail-parser) are all still on 8.0.0 from
  2023-12-05 even though the main @sendgrid/mail line advanced to 8.1.6.
