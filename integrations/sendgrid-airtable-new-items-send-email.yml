arazzo: 1.0.1
info:
  title: Send emails via SendGrid for new Airtable records in view
  version: 1.0.0
  description: 'Send emails via SendGrid for new Airtable records in view (Zapier
    template). Reads new items from airtable with listRecords, then sends an email
    with SendGrid SendMail. Mapping item fields into the message is left to the caller:
    the airtable response schema does not fix which field holds the recipient address.'
sourceDescriptions:
- name: airtable
  url: https://raw.githubusercontent.com/api-evangelist/airtable/refs/heads/main/openapi/airtable-records-api-openapi.yml
  type: openapi
- name: sendgrid
  url: https://raw.githubusercontent.com/api-evangelist/sendgrid/refs/heads/main/openapi/sendgrid-mail-send-api-openapi.yml
  type: openapi
workflows:
- workflowId: airtableToSendgridEmail
  summary: Send emails via SendGrid for new Airtable records in view
  inputs:
    type: object
    properties:
      baseId:
        type: string
      table:
        type: string
      view:
        type: string
      to_email:
        type: string
      from_email:
        type: string
      subject:
        type: string
      content:
        type: string
  steps:
  - stepId: fetch-records
    description: List records in view
    operationId: $sourceDescriptions.airtable.listRecords
    parameters:
    - name: baseId
      in: path
      value: $inputs.baseId
    - name: tableIdOrName
      in: path
      value: $inputs.table
    - name: view
      in: query
      value: $inputs.view
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      items: $response.body#/records
  - stepId: send-email
    description: Send the email through SendGrid
    operationId: $sourceDescriptions.sendgrid.SendMail
    requestBody:
      contentType: application/json
      payload:
        personalizations:
        - to:
          - email: $inputs.to_email
        from:
          email: $inputs.from_email
        subject: $inputs.subject
        content:
        - type: text/plain
          value: $inputs.content
    successCriteria:
    - condition: $statusCode == 202
  outputs:
    items: $steps.fetch-records.outputs.items
x-integration:
  partner: airtable
  template: https://zapier.com/apps/airtable/integrations/sendgrid/72756/send-emails-via-sendgrid-for-new-airtable-records-in-view
  edge_evidence: https://zapier.com/apps/airtable/integrations/sendgrid/72756/send-emails-via-sendgrid-for-new-airtable-records-in-view
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: claude-opus-5-5
  guessed_steps:
  - step: send-email
    cause: partner-contract
    why: the airtable listRecords response does not define which field carries the
      recipient address, so to_email is an input
