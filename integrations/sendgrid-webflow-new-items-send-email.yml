arazzo: 1.0.1
info:
  title: Send SendGrid emails from new Webflow submissions
  version: 1.0.0
  description: 'Send SendGrid emails from new Webflow submissions (Zapier template).
    Reads new items from webflow with getSitesBySiteIdFormsByFormIdSubmissions, then
    sends an email with SendGrid SendMail. Mapping item fields into the message is
    left to the caller: the webflow response schema does not fix which field holds
    the recipient address.'
sourceDescriptions:
- name: webflow
  url: https://raw.githubusercontent.com/api-evangelist/webflow/refs/heads/main/openapi/webflow-forms-api-openapi.yml
  type: openapi
- name: sendgrid
  url: https://raw.githubusercontent.com/api-evangelist/sendgrid/refs/heads/main/openapi/sendgrid-mail-send-api-openapi.yml
  type: openapi
workflows:
- workflowId: webflowToSendgridEmail
  summary: Send SendGrid emails from new Webflow submissions
  inputs:
    type: object
    properties:
      siteId:
        type: string
      formId:
        type: string
      to_email:
        type: string
      from_email:
        type: string
      subject:
        type: string
      content:
        type: string
  steps:
  - stepId: fetch-submissions
    description: List form submissions
    operationId: $sourceDescriptions.webflow.getSitesBySiteIdFormsByFormIdSubmissions
    parameters:
    - name: site_id
      in: path
      value: $inputs.siteId
    - name: form_id
      in: path
      value: $inputs.formId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      items: $response.body
  - stepId: send-email
    description: Send the email through SendGrid
    operationId: $sourceDescriptions.sendgrid.SendMail
    requestBody:
      contentType: application/json
      payload:
        personalizations:
        - to:
          - email: $inputs.to_email
        from:
          email: $inputs.from_email
        subject: $inputs.subject
        content:
        - type: text/plain
          value: $inputs.content
    successCriteria:
    - condition: $statusCode == 202
  outputs:
    items: $steps.fetch-submissions.outputs.items
x-integration:
  partner: webflow
  template: https://zapier.com/apps/sendgrid/integrations/webflow/72894/send-sendgrid-emails-from-new-webflow-submissions
  edge_evidence: https://zapier.com/apps/sendgrid/integrations/webflow/72894/send-sendgrid-emails-from-new-webflow-submissions
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: claude-opus-5-5
  guessed_steps:
  - step: send-email
    cause: partner-contract
    why: the webflow getSitesBySiteIdFormsByFormIdSubmissions response does not define
      which field carries the recipient address, so to_email is an input
