arazzo: 1.0.1
info:
  title: Send emails with SendGrid for new Tally submissions
  version: 1.0.0
  description: 'Send emails with SendGrid for new Tally submissions (Zapier template).
    Reads new items from tally with listSubmissions, then sends an email with SendGrid
    SendMail. Mapping item fields into the message is left to the caller: the tally
    response schema does not fix which field holds the recipient address.'
sourceDescriptions:
- name: tally
  url: https://raw.githubusercontent.com/api-evangelist/tally/refs/heads/main/openapi/tally-submissions-api-openapi.yml
  type: openapi
- name: sendgrid
  url: https://raw.githubusercontent.com/api-evangelist/sendgrid/refs/heads/main/openapi/sendgrid-mail-send-api-openapi.yml
  type: openapi
workflows:
- workflowId: tallyToSendgridEmail
  summary: Send emails with SendGrid for new Tally submissions
  inputs:
    type: object
    properties:
      formId:
        type: string
      to_email:
        type: string
      from_email:
        type: string
      subject:
        type: string
      content:
        type: string
  steps:
  - stepId: fetch-submissions
    description: List form submissions
    operationId: $sourceDescriptions.tally.listSubmissions
    parameters:
    - name: id
      in: path
      value: $inputs.formId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      items: $response.body
  - stepId: send-email
    description: Send the email through SendGrid
    operationId: $sourceDescriptions.sendgrid.SendMail
    requestBody:
      contentType: application/json
      payload:
        personalizations:
        - to:
          - email: $inputs.to_email
        from:
          email: $inputs.from_email
        subject: $inputs.subject
        content:
        - type: text/plain
          value: $inputs.content
    successCriteria:
    - condition: $statusCode == 202
  outputs:
    items: $steps.fetch-submissions.outputs.items
x-integration:
  partner: tally
  template: https://zapier.com/apps/sendgrid/integrations/tally/1309322/send-emails-with-sendgrid-for-new-tally-submissions
  edge_evidence: https://zapier.com/apps/sendgrid/integrations/tally/1309322/send-emails-with-sendgrid-for-new-tally-submissions
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: claude-opus-5-5
  guessed_steps:
  - step: send-email
    cause: partner-contract
    why: the tally listSubmissions response does not define which field carries the
      recipient address, so to_email is an input
