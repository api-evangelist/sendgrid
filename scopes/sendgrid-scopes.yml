source: https://www.twilio.com/docs/sendgrid/api-reference/api-key-permissions
docs: https://www.twilio.com/docs/sendgrid/api-reference/api-key-permissions
description: 'SendGrid''s permission scopes. IMPORTANT QUALIFIER: these are NOT OAuth 2.0 scopes. SendGrid runs no OAuth2/OIDC authorization server for API access — the derive-oauth-scopes pass over the
  63 OpenAPI documents in this repo found ZERO oauth2 securitySchemes, and /.well-known/oauth-authorization-server on api.sendgrid.com returns 403. What SendGrid publishes instead is a fixed vocabulary
  of dot-notation PERMISSION scopes attached to an API key at creation time and sent as a bearer token. They occupy the same role as OAuth scopes — they bound what a credential may do — and are recorded
  here under that type so an agent can reason about least privilege, with the distinction stated rather than papered over. Scopes are read programmatically from the API Key Permissions API (GET /v3/scopes,
  openapi/sendgrid-scopes-api-openapi.yml), which returns the scopes the authenticated user may grant, and are assigned through the API Keys API (POST /v3/api_keys with a scopes[] array).'
model:
  type: api-key-permission-scopes
  oauth2: false
  openid_connect: false
  format: dot-notation, resource-first (e.g. mail.send, alerts.create)
  crud_suffixes:
  - create
  - read
  - update
  - delete
  assignment: Scopes are bound to an API key at creation and can be changed with PUT /v3/api_keys/{api_key_id} (UpdateApiKeyNameAndScopes). A key's scopes cannot exceed the scopes of the user or teammate
    that created it.
  full_access: '"Admin Permissions" grants every scope listed below; SendGrid''s docs recommend scoping keys to the minimum set instead.'
  teammates: Teammate permissions use the same scope vocabulary for console users — https://www.twilio.com/docs/sendgrid/ui/account-and-settings/teammate-permissions
endpoints:
  list_grantable_scopes:
    operation: GET /v3/scopes
    docs: https://www.twilio.com/docs/sendgrid/api-reference/api-key-permissions/retrieve-a-list-of-scopes-for-which-this-user-has-access
    note: Returns the scope strings the authenticated credential is allowed to grant.
  update_key_scopes:
    operation: PUT /v3/api_keys/{api_key_id}
    docs: https://www.twilio.com/docs/sendgrid/api-reference/api-keys/update-api-key-name-and-scopes
