notes:
- The published permission page groups scopes rather than enumerating a flat machine-readable list; the vocabulary above is transcribed from that page and from the CRUD pattern SendGrid applies uniformly.
  GET /v3/scopes on a live key is the authoritative enumeration for a given account tier — some scopes (email validation, subusers, SSO) only appear on Pro/Premier accounts.
- SAML 2.0 SSO exists for console login (openapi/sendgrid-sso-settings-api-openapi.yml) but is not an API authorization mechanism and mints no scopes.
