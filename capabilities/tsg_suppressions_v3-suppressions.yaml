naftiko: 1.0.0-alpha2
info:
  label: Twilio SendGrid Suppressions API — Suppressions
  description: 'Twilio SendGrid Suppressions API — Suppressions. 6 operations. Lead operation: Add suppressions to a suppression
    group. Self-contained Naftiko capability covering one Sendgrid business surface.'
  tags:
  - Sendgrid
  - Suppressions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SENDGRID_API_KEY: SENDGRID_API_KEY
capability:
  consumes:
  - type: http
    namespace: tsg_suppressions_v3-suppressions
    baseUri: https://api.sendgrid.com
    description: Twilio SendGrid Suppressions API — Suppressions business capability. Self-contained, no shared references.
    resources:
    - name: v3-asm-groups-group_id-suppressions
      path: /v3/asm/groups/{group_id}/suppressions
      operations:
      - name: addsuppressiontoasmgroup
        method: POST
        description: Add suppressions to a suppression group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: listsuppressionfromasmgroup
        method: GET
        description: Retrieve all suppressions for a suppression group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v3-asm-groups-group_id-suppressions-search
      path: /v3/asm/groups/{group_id}/suppressions/search
      operations:
      - name: searchsuppressionfromasmgroup
        method: POST
        description: Search for suppressions within a group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: v3-asm-groups-group_id-suppressions-email
      path: /v3/asm/groups/{group_id}/suppressions/{email}
      operations:
      - name: deletesuppressionfromasmgroup
        method: DELETE
        description: Delete a suppression from a suppression group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v3-asm-suppressions
      path: /v3/asm/suppressions
      operations:
      - name: listasmsuppression
        method: GET
        description: Retrieve all suppressions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v3-asm-suppressions-email
      path: /v3/asm/suppressions/{email}
      operations:
      - name: getasmsuppression
        method: GET
        description: Retrieve all suppression groups for an email address
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SENDGRID_API_KEY}}'
  exposes:
  - type: rest
    namespace: tsg_suppressions_v3-suppressions-rest
    port: 8080
    description: REST adapter for Twilio SendGrid Suppressions API — Suppressions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v3/asm/groups/{group-id}/suppressions
      name: v3-asm-groups-group-id-suppressions
      description: REST surface for v3-asm-groups-group_id-suppressions.
      operations:
      - method: POST
        name: addsuppressiontoasmgroup
        description: Add suppressions to a suppression group
        call: tsg_suppressions_v3-suppressions.addsuppressiontoasmgroup
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listsuppressionfromasmgroup
        description: Retrieve all suppressions for a suppression group
        call: tsg_suppressions_v3-suppressions.listsuppressionfromasmgroup
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/asm/groups/{group-id}/suppressions/search
      name: v3-asm-groups-group-id-suppressions-search
      description: REST surface for v3-asm-groups-group_id-suppressions-search.
      operations:
      - method: POST
        name: searchsuppressionfromasmgroup
        description: Search for suppressions within a group
        call: tsg_suppressions_v3-suppressions.searchsuppressionfromasmgroup
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/asm/groups/{group-id}/suppressions/{email}
      name: v3-asm-groups-group-id-suppressions-email
      description: REST surface for v3-asm-groups-group_id-suppressions-email.
      operations:
      - method: DELETE
        name: deletesuppressionfromasmgroup
        description: Delete a suppression from a suppression group
        call: tsg_suppressions_v3-suppressions.deletesuppressionfromasmgroup
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/asm/suppressions
      name: v3-asm-suppressions
      description: REST surface for v3-asm-suppressions.
      operations:
      - method: GET
        name: listasmsuppression
        description: Retrieve all suppressions
        call: tsg_suppressions_v3-suppressions.listasmsuppression
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/asm/suppressions/{email}
      name: v3-asm-suppressions-email
      description: REST surface for v3-asm-suppressions-email.
      operations:
      - method: GET
        name: getasmsuppression
        description: Retrieve all suppression groups for an email address
        call: tsg_suppressions_v3-suppressions.getasmsuppression
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tsg_suppressions_v3-suppressions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twilio SendGrid Suppressions API — Suppressions. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: add-suppressions-suppression-group
      description: Add suppressions to a suppression group
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: tsg_suppressions_v3-suppressions.addsuppressiontoasmgroup
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-all-suppressions-suppression-group
      description: Retrieve all suppressions for a suppression group
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tsg_suppressions_v3-suppressions.listsuppressionfromasmgroup
      outputParameters:
      - type: object
        mapping: $.
    - name: search-suppressions-within-group
      description: Search for suppressions within a group
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: tsg_suppressions_v3-suppressions.searchsuppressionfromasmgroup
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-suppression-suppression-group
      description: Delete a suppression from a suppression group
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: tsg_suppressions_v3-suppressions.deletesuppressionfromasmgroup
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-all-suppressions
      description: Retrieve all suppressions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tsg_suppressions_v3-suppressions.listasmsuppression
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-all-suppression-groups-email
      description: Retrieve all suppression groups for an email address
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tsg_suppressions_v3-suppressions.getasmsuppression
      outputParameters:
      - type: object
        mapping: $.
