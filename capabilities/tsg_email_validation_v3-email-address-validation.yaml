naftiko: 1.0.0-alpha2
info:
  label: Twilio SendGrid Email Address Validation API — Email Address Validation
  description: 'Twilio SendGrid Email Address Validation API — Email Address Validation. 1 operations. Lead operation: Validate
    an email. Self-contained Naftiko capability covering one Sendgrid business surface.'
  tags:
  - Sendgrid
  - Email Address Validation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SENDGRID_API_KEY: SENDGRID_API_KEY
capability:
  consumes:
  - type: http
    namespace: tsg_email_validation_v3-email-address-validation
    baseUri: https://api.sendgrid.com
    description: Twilio SendGrid Email Address Validation API — Email Address Validation business capability. Self-contained,
      no shared references.
    resources:
    - name: v3-validations-email
      path: /v3/validations/email
      operations:
      - name: validateemail
        method: POST
        description: Validate an email
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SENDGRID_API_KEY}}'
  exposes:
  - type: rest
    namespace: tsg_email_validation_v3-email-address-validation-rest
    port: 8080
    description: REST adapter for Twilio SendGrid Email Address Validation API — Email Address Validation. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v3/validations/email
      name: v3-validations-email
      description: REST surface for v3-validations-email.
      operations:
      - method: POST
        name: validateemail
        description: Validate an email
        call: tsg_email_validation_v3-email-address-validation.validateemail
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tsg_email_validation_v3-email-address-validation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twilio SendGrid Email Address Validation API — Email Address Validation. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: validate-email
      description: Validate an email
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: tsg_email_validation_v3-email-address-validation.validateemail
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
