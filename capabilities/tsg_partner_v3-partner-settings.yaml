naftiko: 1.0.0-alpha2
info:
  label: Twilio SendGrid Partner API — Partner Settings
  description: 'Twilio SendGrid Partner API — Partner Settings. 1 operations. Lead operation: Returns a list of all partner
    settings.. Self-contained Naftiko capability covering one Sendgrid business surface.'
  tags:
  - Sendgrid
  - Partner Settings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SENDGRID_API_KEY: SENDGRID_API_KEY
capability:
  consumes:
  - type: http
    namespace: tsg_partner_v3-partner-settings
    baseUri: https://api.sendgrid.com
    description: Twilio SendGrid Partner API — Partner Settings business capability. Self-contained, no shared references.
    resources:
    - name: v3-partner_settings
      path: /v3/partner_settings
      operations:
      - name: listpartnersetting
        method: GET
        description: Returns a list of all partner settings.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: '`limit` sets the page size, i.e. maximum number of items from the list to be returned for a single
            API request. If omitted, the default page size is used.'
    authentication:
      type: bearer
      token: '{{env.SENDGRID_API_KEY}}'
  exposes:
  - type: rest
    namespace: tsg_partner_v3-partner-settings-rest
    port: 8080
    description: REST adapter for Twilio SendGrid Partner API — Partner Settings. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v3/partner-settings
      name: v3-partner-settings
      description: REST surface for v3-partner_settings.
      operations:
      - method: GET
        name: listpartnersetting
        description: Returns a list of all partner settings.
        call: tsg_partner_v3-partner-settings.listpartnersetting
        with:
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tsg_partner_v3-partner-settings-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twilio SendGrid Partner API — Partner Settings. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: returns-list-all-partner-settings
      description: Returns a list of all partner settings.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tsg_partner_v3-partner-settings.listpartnersetting
      with:
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
