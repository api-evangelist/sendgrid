naftiko: 1.0.0-alpha2
info:
  label: Twilio SendGrid Engagement Quality API — Engagement Quality
  description: 'Twilio SendGrid Engagement Quality API — Engagement Quality. 2 operations. Lead operation: Get Engagement
    Quality Scores. Self-contained Naftiko capability covering one Sendgrid business surface.'
  tags:
  - Sendgrid
  - Engagement Quality
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SENDGRID_API_KEY: SENDGRID_API_KEY
capability:
  consumes:
  - type: http
    namespace: tsg_seq_v3-engagement-quality
    baseUri: https://api.sendgrid.com
    description: Twilio SendGrid Engagement Quality API — Engagement Quality business capability. Self-contained, no shared
      references.
    resources:
    - name: v3-engagementquality-scores
      path: /v3/engagementquality/scores
      operations:
      - name: listengagementqualityscore
        method: GET
        description: Get Engagement Quality Scores
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: string
          description: The starting date in YYYY-MM-DD format (UTC) for which you want to retrieve scores.
          required: true
        - name: to
          in: query
          type: string
          description: The ending date in YYYY-MM-DD format (UTC) for which you want to retrieve scores.
          required: true
    - name: v3-engagementquality-subusers-scores
      path: /v3/engagementquality/subusers/scores
      operations:
      - name: listsubuserengagementqualityscore
        method: GET
        description: Get Subusers' Engagement Quality Scores
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SENDGRID_API_KEY}}'
  exposes:
  - type: rest
    namespace: tsg_seq_v3-engagement-quality-rest
    port: 8080
    description: REST adapter for Twilio SendGrid Engagement Quality API — Engagement Quality. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v3/engagementquality/scores
      name: v3-engagementquality-scores
      description: REST surface for v3-engagementquality-scores.
      operations:
      - method: GET
        name: listengagementqualityscore
        description: Get Engagement Quality Scores
        call: tsg_seq_v3-engagement-quality.listengagementqualityscore
        with:
          from: rest.from
          to: rest.to
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/engagementquality/subusers/scores
      name: v3-engagementquality-subusers-scores
      description: REST surface for v3-engagementquality-subusers-scores.
      operations:
      - method: GET
        name: listsubuserengagementqualityscore
        description: Get Subusers' Engagement Quality Scores
        call: tsg_seq_v3-engagement-quality.listsubuserengagementqualityscore
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tsg_seq_v3-engagement-quality-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twilio SendGrid Engagement Quality API — Engagement Quality. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: get-engagement-quality-scores
      description: Get Engagement Quality Scores
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tsg_seq_v3-engagement-quality.listengagementqualityscore
      with:
        from: tools.from
        to: tools.to
      outputParameters:
      - type: object
        mapping: $.
    - name: get-subusers-engagement-quality-scores
      description: Get Subusers' Engagement Quality Scores
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tsg_seq_v3-engagement-quality.listsubuserengagementqualityscore
      outputParameters:
      - type: object
        mapping: $.
