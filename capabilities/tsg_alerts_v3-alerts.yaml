naftiko: 1.0.0-alpha2
info:
  label: Twilio SendGrid Alerts API — Alerts
  description: 'Twilio SendGrid Alerts API — Alerts. 5 operations. Lead operation: Create a new Alert. Self-contained Naftiko
    capability covering one Sendgrid business surface.'
  tags:
  - Sendgrid
  - Alerts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SENDGRID_API_KEY: SENDGRID_API_KEY
capability:
  consumes:
  - type: http
    namespace: tsg_alerts_v3-alerts
    baseUri: https://api.sendgrid.com
    description: Twilio SendGrid Alerts API — Alerts business capability. Self-contained, no shared references.
    resources:
    - name: v3-alerts
      path: /v3/alerts
      operations:
      - name: createalert
        method: POST
        description: Create a new Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: listalert
        method: GET
        description: Retrieve all alerts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v3-alerts-alert_id
      path: /v3/alerts/{alert_id}
      operations:
      - name: getalert
        method: GET
        description: Retrieve a specific alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletealert
        method: DELETE
        description: Delete an alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatealert
        method: PATCH
        description: Update an alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SENDGRID_API_KEY}}'
  exposes:
  - type: rest
    namespace: tsg_alerts_v3-alerts-rest
    port: 8080
    description: REST adapter for Twilio SendGrid Alerts API — Alerts. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v3/alerts
      name: v3-alerts
      description: REST surface for v3-alerts.
      operations:
      - method: POST
        name: createalert
        description: Create a new Alert
        call: tsg_alerts_v3-alerts.createalert
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listalert
        description: Retrieve all alerts
        call: tsg_alerts_v3-alerts.listalert
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/alerts/{alert-id}
      name: v3-alerts-alert-id
      description: REST surface for v3-alerts-alert_id.
      operations:
      - method: GET
        name: getalert
        description: Retrieve a specific alert
        call: tsg_alerts_v3-alerts.getalert
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletealert
        description: Delete an alert
        call: tsg_alerts_v3-alerts.deletealert
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatealert
        description: Update an alert
        call: tsg_alerts_v3-alerts.updatealert
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tsg_alerts_v3-alerts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Twilio SendGrid Alerts API — Alerts. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-new-alert
      description: Create a new Alert
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: tsg_alerts_v3-alerts.createalert
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-all-alerts
      description: Retrieve all alerts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tsg_alerts_v3-alerts.listalert
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-specific-alert
      description: Retrieve a specific alert
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tsg_alerts_v3-alerts.getalert
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-alert
      description: Delete an alert
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: tsg_alerts_v3-alerts.deletealert
      outputParameters:
      - type: object
        mapping: $.
    - name: update-alert
      description: Update an alert
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: tsg_alerts_v3-alerts.updatealert
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
