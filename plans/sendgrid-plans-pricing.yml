  2026-08-13 (the 2026-05-04 values were a bulk-sweep generation and are now
  confirmed and extended with the published overage rates and per-tier limits).
  URL NOTE WORTH RECORDING: the historic pricing URLs have collapsed into the
  Twilio site — sendgrid.com/en-us/pricing and twilio.com/en-us/sendgrid/pricing
  both 301 to https://www.twilio.com/en-us/sendgrid, a marketing landing page
  that shows no prices; the only surface still carrying the tier table is
  https://www.twilio.com/en-us/products/email-api/pricing. Any integrator or
  agent following the pricing link recorded in older catalogs lands on a page
  with no pricing on it.
plan_count: 4
