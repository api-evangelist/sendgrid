description: >-
  Probe of the standard /.well-known/ discovery surface on every host this
  provider serves: the two API hosts from the OpenAPI servers[] blocks
  (api.sendgrid.com, api.eu.sendgrid.com), the marketing host (sendgrid.com),
  and the documentation host (www.twilio.com, where the entire SendGrid
  developer reference lives). RESULT: NOTHING IS PUBLISHED. Every path on every
  SendGrid host returns HTTP 403 from nginx; every path on the Twilio docs host
  returns HTTP 404. No security.txt, no OIDC or OAuth authorization-server
  metadata, no api-catalog, no ai-plugin manifest, no agent card.
  This is a RECORDED ABSENCE, and deliberately carries NO WellKnown pointer in
  apis.yml — a probe documenting a 403/404 on every path must not be wired as
  though the provider serves that surface. The 2026-06-20 pass wired one; it has
  been removed.
  The absence is internally consistent with the rest of the profile: SendGrid
  authenticates with bearer API keys and runs no OAuth2/OIDC authorization
  server (see authentication/ and scopes/), so there is no OIDC/OAuth metadata
  to publish. The missing security.txt is a genuine gap, not an artifact of the
  auth model — SendGrid's vulnerability-disclosure program is real and
  documented (security/sendgrid-vulnerability-disclosure.yml), just not
  discoverable at RFC 9116's well-known path.
