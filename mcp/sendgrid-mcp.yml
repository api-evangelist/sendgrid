description: >-
  SendGrid does not publish a dedicated first-party hosted MCP server. The
  official Model Context Protocol coverage for SendGrid comes from the
  Twilio-labs MCP server (@twilio-alpha/mcp), which generates MCP tools from
  Twilio's OpenAPI and indexes Twilio SendGrid documentation alongside 30+
  Twilio products. Several community SendGrid-specific MCP servers also exist
  (not first-party). Below we record the official Twilio MCP server as the
  authoritative option and DERIVE a candidate tool list from the SendGrid v3
  OpenAPI operations already in this repo (one tool per operationId); these are
  a starting point, not a published SendGrid tool manifest.
official_servers:
  - name: twilio-labs-mcp
    vendor: Twilio (twilio-labs)
    package: "@twilio-alpha/mcp"
    npm: https://www.npmjs.com/package/@twilio-alpha/mcp
    repo: https://github.com/twilio-labs/mcp
    transport: stdio
    install: "npx -y @twilio-alpha/mcp <ACCOUNT_SID>/<API_KEY>:<API_SECRET>"
    covers: >-
      Twilio platform APIs plus indexed Twilio SendGrid and Segment
      documentation; supports --services and --tags filters to scope exposed
      operations.
community_servers:
  - name: Garoth/sendgrid-mcp
    repo: https://github.com/Garoth/sendgrid-mcp
    official: false
    note: Contact lists, templates, single sends, and stats over the SendGrid v3 API.
