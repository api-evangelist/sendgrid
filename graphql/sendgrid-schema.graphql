# SendGrid Conceptual GraphQL Schema
#
# SendGrid is a REST-only platform. This schema is a conceptual translation
# of SendGrid's email data model into GraphQL SDL, derived from the official
# REST API reference at https://docs.sendgrid.com/api-reference.
#
# Types covered:
#   Email, EmailMessage, Template, DynamicTemplate, Contact, List, Segment,
#   Suppression, SpamReport, UnsubscribeGroup, ApiKey, Category, SubUser,
#   IpAddress, IpPool, DomainAuth, BrandedLink, Stats, GlobalStats,
#   CategoryStats, TemplateStats, WebhookEvent, BatchId, Scheduled,
#   SenderAuth, SingleSend, AutomationEmail

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

scalar DateTime
scalar JSON

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enum EmailStatus {
  PROCESSED
  DROPPED
  DELIVERED
  DEFERRED
  BOUNCE
  BLOCKED
  SPAM_REPORT
  UNSUBSCRIBE
  GROUP_UNSUBSCRIBE
  GROUP_RESUBSCRIBE
  OPEN
  CLICK
}

enum TemplateGeneration {
  LEGACY
  DYNAMIC
}

enum TemplateVersionEditor {
  CODE
  DESIGN
}

enum SegmentStatus {
  ACTIVE
  INACTIVE
}

enum SuppressionType {
  BOUNCE
  BLOCK
  SPAM_REPORT
  INVALID_EMAIL
  UNSUBSCRIBE
}

enum ApiKeyScope {
  MAIL_SEND
  ALERTS_READ
  ALERTS_WRITE
  STATS_READ
  TEMPLATES_READ
  TEMPLATES_WRITE
  MARKETING_CAMPAIGNS_READ
  MARKETING_CAMPAIGNS_WRITE
  SUPPRESSIONS_READ
  SUPPRESSIONS_WRITE
  CONTACTS_READ
  CONTACTS_WRITE
  API_KEYS_READ
  API_KEYS_WRITE
  SUBUSERS_READ
  SUBUSERS_WRITE
  IP_MANAGEMENT_READ
  IP_MANAGEMENT_WRITE
  DOMAIN_AUTH_READ
  DOMAIN_AUTH_WRITE
  WEBHOOK_READ
  WEBHOOK_WRITE
}

enum SingleSendStatus {
  DRAFT
  SCHEDULED
  TRIGGERED
  CANCELED
  DONE
}

enum AutomationStatus {
  DRAFT
  ACTIVE
  PAUSED
}

enum WebhookEventType {
  PROCESSED
  DROPPED
  DELIVERED
  DEFERRED
  BOUNCE
  BLOCKED
  SPAM_REPORT
  UNSUBSCRIBE
  GROUP_UNSUBSCRIBE
  GROUP_RESUBSCRIBE
  OPEN
  CLICK
}

enum IpWarmupStatus {
  WARMING
  WARMED
}

enum DomainAuthStatus {
  VALID
  INVALID
  PENDING
}

# ---------------------------------------------------------------------------
# Core Email Types
# ---------------------------------------------------------------------------

type Email {
  id: ID!
  messageId: String
  from: EmailAddress!
  to: [EmailAddress!]!
  cc: [EmailAddress!]
  bcc: [EmailAddress!]
  subject: String!
  content: [EmailContent!]
  attachments: [EmailAttachment!]
  templateId: String
  dynamicTemplateData: JSON
  categories: [String!]
  customArgs: JSON
  headers: JSON
  sendAt: Int
  batchId: String
  ipPoolName: String
  mailSettings: MailSettings
  trackingSettings: TrackingSettings
  status: EmailStatus
  createdAt: DateTime
}

type EmailAddress {
  email: String!
  name: String
}

type EmailContent {
  type: String!
  value: String!
}

type EmailAttachment {
  content: String!
  type: String
  filename: String!
  disposition: String
  contentId: String
}

type MailSettings {
  bypassListManagement: BypassSetting
  bypassSpamManagement: BypassSetting
  bypassBounceManagement: BypassSetting
  bypassUnsubscribeManagement: BypassSetting
  footer: FooterSetting
  sandboxMode: BypassSetting
}

type BypassSetting {
  enable: Boolean
}

type FooterSetting {
  enable: Boolean
  text: String
  html: String
}

type TrackingSettings {
  clickTracking: ClickTrackingSetting
  openTracking: OpenTrackingSetting
  subscriptionTracking: SubscriptionTrackingSetting
  ganalytics: GanalyticsSetting
}

type ClickTrackingSetting {
  enable: Boolean
  enableText: Boolean
}

type OpenTrackingSetting {
  enable: Boolean
  substitutionTag: String
}

type SubscriptionTrackingSetting {
  enable: Boolean
  text: String
  html: String
  substitutionTag: String
}

type GanalyticsSetting {
  enable: Boolean
  utmSource: String
  utmMedium: String
  utmTerm: String
  utmContent: String
  utmCampaign: String
}

# EmailMessage represents an email activity log entry
type EmailMessage {
  msgId: String!
  fromEmail: String!
  subject: String
  toEmail: String!
  status: EmailStatus!
  clicksCount: Int
  opensCount: Int
  lastEventTime: DateTime
  templateId: String
  categories: [String!]
  asmGroupId: Int
  nicerType: String
  outboundIp: String
  outboundIpType: String
}

# ---------------------------------------------------------------------------
# Template Types
# ---------------------------------------------------------------------------

type Template {
  id: ID!
  name: String!
  generation: TemplateGeneration!
  updatedAt: DateTime
  versions: [TemplateVersion!]
}

type TemplateVersion {
  id: ID!
  templateId: String!
