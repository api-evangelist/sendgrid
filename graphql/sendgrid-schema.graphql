  ips: [String!]
  customSpf: Boolean
  isDefault: Boolean
  legacy: Boolean
  automaticSecurity: Boolean
  valid: Boolean
  dns: DomainAuthDns
}

type DomainAuthDns {
  mailCname: DnsRecord
  dkim1: DnsRecord
  dkim2: DnsRecord
}

type DnsRecord {
  valid: Boolean
  type: String
  host: String
  data: String
}

type BrandedLink {
  id: ID!
  domain: String!
  subdomain: String
  username: String
  userId: Int
  valid: Boolean
  default: Boolean
  dns: BrandedLinkDns
}

type BrandedLinkDns {
  domainCname: DnsRecord
  ownerCname: DnsRecord
}

type SenderAuth {
  id: ID!
  nickname: String!
  from: EmailAddress!
  replyTo: EmailAddress
  address: String
  address2: String
  city: String
  state: String
  zip: String
  country: String
  verified: Boolean
