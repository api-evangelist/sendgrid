  thumbnailUrl: String
  updatedAt: DateTime
}

type DynamicTemplate {
  id: ID!
  name: String!
  generation: TemplateGeneration!
  updatedAt: DateTime
  versions: [DynamicTemplateVersion!]
}

type DynamicTemplateVersion {
  id: ID!
  templateId: String!
  active: Int
  name: String!
  htmlContent: String
  plainContent: String
  generatePlainContent: Boolean
  subject: String
  editor: TemplateVersionEditor
