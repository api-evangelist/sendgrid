}

# ---------------------------------------------------------------------------
# Single Send Types (Marketing Campaigns)
# ---------------------------------------------------------------------------

type SingleSend {
  id: ID!
  name: String!
  status: SingleSendStatus!
  categories: [String!]
  sendAt: DateTime
  sendTo: SingleSendTarget
  emailConfig: SingleSendEmailConfig
  createdAt: DateTime
  updatedAt: DateTime
}

type SingleSendTarget {
  listIds: [String!]
  segmentIds: [String!]
  all: Boolean
}

type SingleSendEmailConfig {
  subject: String
  htmlContent: String
  plainContent: String
  generatePlainContent: Boolean
  designId: String
  editor: String
  suppressionGroupId: Int
  customUnsubscribeUrl: String
  senderId: Int
  ipPool: String
}

# ---------------------------------------------------------------------------
# Automation Email Types
# ---------------------------------------------------------------------------

type AutomationEmail {
  id: ID!
  name: String!
  status: AutomationStatus!
  categories: [String!]
  createdAt: DateTime
  updatedAt: DateTime
  steps: [AutomationStep!]
}

type AutomationStep {
  id: ID!
  automationId: String!
  delay: AutomationDelay
  emailConfig: SingleSendEmailConfig
}

type AutomationDelay {
  delay: Int
  unit: String
}

# ---------------------------------------------------------------------------
# Engagement Quality
# ---------------------------------------------------------------------------

type EngagementQuality {
  username: String!
  score: Float
  metrics: EngagementMetrics
  periodStart: DateTime
  periodEnd: DateTime
}

type EngagementMetrics {
  bounceRate: Float
  spamRate: Float
  openRate: Float
  clickRate: Float
  unsubscribeRate: Float
}

# ---------------------------------------------------------------------------
# Root Types
# ---------------------------------------------------------------------------

type Query {
  # Email Activity
  emailMessages(limit: Int, offset: Int, query: String): [EmailMessage!]
  emailMessage(msgId: String!): EmailMessage

  # Templates
  templates(generations: [TemplateGeneration!], pageSize: Int): [Template!]
  template(templateId: String!): Template
  templateVersions(templateId: String!): [TemplateVersion!]

  # Contacts
  contacts(pageSize: Int, pageToken: String): [Contact!]
  contact(id: ID!): Contact
  searchContacts(query: String!): [Contact!]

  # Lists
  lists(pageSize: Int, pageToken: String): [ContactList!]
  list(id: ID!): ContactList

  # Segments
  segments(noParentListId: Boolean): [Segment!]
  segment(segmentId: String!): Segment

  # Suppressions
  globalSuppressions: [GlobalSuppression!]
  bounces(startTime: Int, endTime: Int): [Bounce!]
  blocks(startTime: Int, endTime: Int): [Block!]
  spamReports(startTime: Int, endTime: Int): [SpamReport!]
  invalidEmails(startTime: Int, endTime: Int): [InvalidEmail!]
  unsubscribeGroups: [UnsubscribeGroup!]
  unsubscribeGroup(id: ID!): UnsubscribeGroup

  # API Keys
  apiKeys: [ApiKey!]
  apiKey(apiKeyId: String!): ApiKey

  # IP Management
  ipAddresses: [IpAddress!]
  ipAddress(ip: String!): IpAddress
  ipPools: [IpPool!]
  ipPool(name: String!): IpPool
  ipWarmup: [IpWarmup!]

  # Domain Authentication
  domainAuthentications: [DomainAuth!]
  domainAuthentication(id: ID!): DomainAuth

  # Branded Links
  brandedLinks: [BrandedLink!]
  brandedLink(id: ID!): BrandedLink

  # Senders
  senderAuthentications: [SenderAuth!]
  senderAuthentication(id: ID!): SenderAuth

  # Statistics
  globalStats(startDate: String!, endDate: String, aggregatedBy: String): [GlobalStats!]
  categoryStats(startDate: String!, endDate: String, categories: [String!], aggregatedBy: String): [CategoryStats!]
  templateStats(startDate: String!, endDate: String, templateIds: [String!]): [TemplateStats!]

  # Subusers
  subusers(username: String, limit: Int, offset: Int): [SubUser!]
  subuser(username: String!): SubUser

  # Categories
  categories(limit: Int, offset: Int, search: String): [Category!]

  # Single Sends
  singleSends(pageSize: Int, pageToken: String): [SingleSend!]
  singleSend(id: ID!): SingleSend

  # Automations
  automations(pageSize: Int, pageToken: String): [AutomationEmail!]
  automation(id: ID!): AutomationEmail

  # Webhooks
  eventWebhookSettings: WebhookSettings
  parseWebhookSettings: [ParseWebhookSettings!]

  # Scheduled Sends
  scheduledSends: [Scheduled!]
  scheduledSend(batchId: String!): Scheduled

  # Engagement Quality
  engagementQuality(username: String): EngagementQuality

  # Custom Fields
  customFields: [CustomField!]
}

type Mutation {
  # Mail Send
  sendEmail(input: SendEmailInput!): BatchId
  createBatch: BatchId

  # Templates
  createTemplate(name: String!, generation: TemplateGeneration!): Template
  updateTemplate(templateId: String!, name: String!): Template
  deleteTemplate(templateId: String!): Boolean
  createTemplateVersion(templateId: String!, input: TemplateVersionInput!): TemplateVersion
  activateTemplateVersion(templateId: String!, versionId: String!): TemplateVersion
  deleteTemplateVersion(templateId: String!, versionId: String!): Boolean

  # Contacts
  upsertContacts(contacts: [ContactInput!]!, listIds: [String!]): String
  deleteContacts(ids: [String!], deleteAllContacts: Boolean): String

  # Lists
  createList(name: String!): ContactList
  updateList(id: ID!, name: String!): ContactList
  deleteList(id: ID!, deleteContacts: Boolean): Boolean

  # Segments
  createSegment(name: String!, parentListIds: [String!], queryDsl: String!): Segment
  updateSegment(segmentId: String!, name: String, queryDsl: String): Segment
  deleteSegment(segmentId: String!): Boolean
  refreshSegment(segmentId: String!): Boolean

  # Suppressions
  addGlobalSuppression(emails: [String!]!): [String!]
  deleteGlobalSuppression(email: String!): Boolean
  deleteBounce(email: String!): Boolean
  deleteBlock(email: String!): Boolean
  deleteSpamReport(email: String!): Boolean
  deleteInvalidEmail(email: String!): Boolean
  createUnsubscribeGroup(name: String!, description: String!, isDefault: Boolean): UnsubscribeGroup
  updateUnsubscribeGroup(id: ID!, name: String, description: String, isDefault: Boolean): UnsubscribeGroup
  deleteUnsubscribeGroup(id: ID!): Boolean
  addUnsubscribes(groupId: Int!, emails: [String!]!): Boolean

  # API Keys
  createApiKey(name: String!, scopes: [ApiKeyScope!]): ApiKey
  updateApiKey(apiKeyId: String!, name: String, scopes: [ApiKeyScope!]): ApiKey
  deleteApiKey(apiKeyId: String!): Boolean

  # IP Pools
  createIpPool(name: String!): IpPool
  deleteIpPool(name: String!): Boolean
  addIpToPool(name: String!, ip: String!): IpPool
  removeIpFromPool(name: String!, ip: String!): Boolean

  # Domain Authentication
  authenticateDomain(domain: String!, subdomain: String, ips: [String!], customSpf: Boolean, automaticSecurity: Boolean, isDefault: Boolean): DomainAuth
  validateDomainAuth(id: ID!): DomainAuth
  deleteDomainAuth(id: ID!): Boolean

  # Branded Links
  createBrandedLink(domain: String!, subdomain: String, default: Boolean): BrandedLink
  validateBrandedLink(id: ID!): BrandedLink
  deleteBrandedLink(id: ID!): Boolean

  # Senders
  createSenderAuth(input: SenderAuthInput!): SenderAuth
  updateSenderAuth(id: ID!, input: SenderAuthInput!): SenderAuth
  deleteSenderAuth(id: ID!): Boolean
  resendSenderVerification(id: ID!): Boolean

  # Subusers
  createSubUser(username: String!, email: String!, password: String!, ips: [String!]!): SubUser
  updateSubUser(username: String!, disabled: Boolean): SubUser
  deleteSubUser(username: String!): Boolean

  # Single Sends
  createSingleSend(input: SingleSendInput!): SingleSend
  updateSingleSend(id: ID!, input: SingleSendInput!): SingleSend
  deleteSingleSend(id: ID!): Boolean
  scheduleSingleSend(id: ID!, sendAt: DateTime): SingleSend
  cancelSingleSend(id: ID!): SingleSend
  duplicateSingleSend(id: ID!, name: String): SingleSend

  # Automations
  createAutomation(input: AutomationInput!): AutomationEmail
  updateAutomation(id: ID!, input: AutomationInput!): AutomationEmail
  deleteAutomation(id: ID!): Boolean

  # Webhook Settings
  updateEventWebhookSettings(input: WebhookSettingsInput!): WebhookSettings
  createParseWebhookSettings(hostname: String!, url: String!, spamCheck: Boolean, sendRaw: Boolean): ParseWebhookSettings
  deleteParseWebhookSettings(hostname: String!): Boolean

  # Scheduled Sends
  cancelScheduledSend(batchId: String!): Scheduled
  pauseScheduledSend(batchId: String!): Scheduled
  deleteScheduledSend(batchId: String!): Boolean

  # Custom Fields
  createCustomField(name: String!, fieldType: String!): CustomField
  deleteCustomField(id: ID!): Boolean
}

